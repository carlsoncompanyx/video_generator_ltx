name: One-time RunPod release trigger

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message != 'Remove temporary RunPod release trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Create release for the pushed worker commit
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `runpod-${context.sha.slice(0, 12)}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                draft: false,
                prerelease: false,
                generate_release_notes: false
              });
            }
